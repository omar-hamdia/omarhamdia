<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Omar Hamdia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        if(localStorage.getItem('theme') === 'light') { document.documentElement.classList.add('light'); }
        if(localStorage.getItem('lang') === 'en') { document.documentElement.dir = 'ltr'; document.documentElement.lang = 'en'; }
    </script>
</head>
<body class="project-page">
    <div class="geo-bg" aria-hidden="true">
        <div class="geo-shape geo-1"></div>
        <div class="geo-shape geo-2"></div>
        <div class="geo-shape geo-3"></div>
        <div class="geo-shape geo-4"></div>
        <div class="geo-glow geo-glow-1"></div>
        <div class="geo-glow geo-glow-2"></div>
    </div>

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <header class="navbar scrolled" id="navbar">
        <a href="index.html" class="logo" style="display:flex; align-items:center; gap:0.5rem; text-decoration:none;">
            <img src="img/logo.png" alt="OH Logo" width="36" height="auto">
            <div style="line-height: 1.1;">
                <div><span style="font-weight:800; color:var(--heading);">OMAR</span> <span style="font-weight:800; color:var(--teal);">HAMDIA</span></div>
            </div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-link" id="navBack">← Back to Home</a>
            <button id="themeToggle" class="icon-btn"><i class="bi bi-moon-fill"></i></button>
            <button id="langToggle" class="btn-outline">EN</button>
        </div>
    </header>

    <main class="container project-details-container" style="padding-top: 120px; padding-bottom: 80px;">
        <!-- Injected via script.js -->
        <div id="projectContent">
            <div class="project-loader">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <div id="lightbox" class="lightbox">
        <button id="lightboxClose" class="lightbox-btn close"><i class="bi bi-x-lg"></i></button>
        <button id="lightboxPrev" class="lightbox-btn prev"><i class="bi bi-chevron-left"></i></button>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Screenshot">
            <div id="lightboxCounter" class="lightbox-counter">1 / 4</div>
        </div>
        <button id="lightboxNext" class="lightbox-btn next"><i class="bi bi-chevron-right"></i></button>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p class="text-muted" id="footerCopy" style="margin-top: 0.8rem;">© 2026 Omar Hamdia. All rights reserved.</p>
        </div>
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
      import { getDatabase, ref, get, runTransaction } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyChkkJidE0HMqOv4FCQ5lb5eHjXSkWZ0Yg",
        authDomain: "omar-b422c.firebaseapp.com",
        databaseURL: "https://omar-b422c-default-rtdb.firebaseio.com",
        projectId: "omar-b422c",
        storageBucket: "omar-b422c.firebasestorage.app",
        messagingSenderId: "684302910692",
        appId: "1:684302910692:web:cf9f16dad072b5c793d8f1",
        measurementId: "G-ZNV1VKJXFN"
      };

      const app = initializeApp(firebaseConfig);
      try { getAnalytics(app); } catch (e) { }
      const db = getDatabase(app);

      window._fbGet = async function(path) {
        try {
          const snap = await Promise.race([
            get(ref(db, path)),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase timeout')), 3000))
          ]);
          return snap.exists() ? snap.val() : null;
        } catch (err) {
          console.warn('Firebase _fbGet failed:', err);
          throw err;
        }
      };

      window._fbTransaction = async function(path, updateFn) {
        try {
          const txPromise = runTransaction(ref(db, path), (current) => {
            return updateFn(current);
          });
          const result = await Promise.race([
            txPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase transaction timeout')), 3000))
          ]);
          return result;
        } catch (err) {
          console.warn('Firebase _fbTransaction failed:', err);
          throw err;
        }
      };
    </script>
    <script>
      // file:// fallback: load compat SDKs and setup helpers
      if (location.protocol === 'file:') {
        (function(){
          const firebaseConfigCompat = {
            apiKey: "AIzaSyChkkJidE0HMqOv4FCQ5lb5eHjXSkWZ0Yg",
            authDomain: "omar-b422c.firebaseapp.com",
            databaseURL: "https://omar-b422c-default-rtdb.firebaseio.com",
            projectId: "omar-b422c",
            storageBucket: "omar-b422c.firebasestorage.app",
            messagingSenderId: "684302910692",
            appId: "1:684302910692:web:cf9f16dad072b5c793d8f1",
            measurementId: "G-ZNV1VKJXFN"
          };

          const s1 = document.createElement('script');
          s1.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
          s1.onload = () => {
            const s2 = document.createElement('script');
            s2.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';
            s2.onload = () => {
              try {
                firebase.initializeApp(firebaseConfigCompat);
                const dbCompat = firebase.database();
                window._fbGet = async function(path){
                  const snapPromise = dbCompat.ref(path).once('value');
                  const snap = await Promise.race([
                    snapPromise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase compat timeout')), 3000))
                  ]);
                  return snap.exists() ? snap.val() : null;
                };
                window._fbTransaction = async function(path, updateFn){
                  const txPromise = dbCompat.ref(path).transaction(updateFn);
                  const res = await Promise.race([
                    txPromise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase compat transaction timeout')), 3000))
                  ]);
                  return res;
                };
                console.info('Firebase compat initialized (file:// fallback)');
              } catch(e) {
                console.warn('Firebase compat init failed:', e);
              }
            };
            document.head.appendChild(s2);
          };
          document.head.appendChild(s1);
        })();
      }
    </script>
    <script src="script.js"></script>
</body>
</html>
